name: telegram-client
version: 1.2.10
description: Telegram client pane for Hermes Desktop - dialogs, message history, topic browsing, and reviewed send/reply/delete/mark-read actions via the connected Telethon user session.
manifest_version: 1
kind: standalone
author: Michael Guber
license: Private
homepage: https://github.com/guberm/hermes-telegram-desktop-plugin
python_dependencies:
  - telethon>=1.40.0,<2
  - qrcode>=8,<9
optional_env:
  - TELEGRAM_API_ID
  - TELEGRAM_API_HASH
